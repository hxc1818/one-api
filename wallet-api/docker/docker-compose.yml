version: '3.8'

services:
  wallet-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: wallet-api
    ports:
      - "8081:8081"
    environment:
      # 数据库配置（与 one-api 共享数据库）
      SQL_DSN: "${SQL_DSN:-root:password@tcp(mysql:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local}"
      
      # 可选：独立的日志数据库
      LOG_SQL_DSN: "${LOG_SQL_DSN}"
      
      # Redis 配置
      REDIS_CONN_STRING: "${REDIS_CONN_STRING:-redis://redis:6379/0}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      
      # JWT 密钥（请修改为随机字符串）
      JWT_SECRET: "${JWT_SECRET:-please-change-me-to-random-string}"
      
      # 服务端口
      WALLET_API_PORT: "8081"
      
      # Redis Stream 配置
      REDIS_STREAM_KEY: "${REDIS_STREAM_KEY:-wallet:balance:updates}"
      REDIS_STREAM_MAXLEN: "${REDIS_STREAM_MAXLEN:-10000}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: wallet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-password}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-oneapi}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  wallet-network:
    driver: bridge
