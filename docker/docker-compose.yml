version: '3.8'

services:
  one-api:
    image: one-api:latest
    container_name: one-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - SQL_DSN=one-api.db
      # 如果使用 MySQL，取消注释下面的行并注释上面的行
      # - SQL_DSN=root:password@tcp(mysql:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      # 如果使用 PostgreSQL，取消注释下面的行
      # - SQL_DSN=postgres://user:password@postgres:5432/oneapi?sslmode=disable
      
      # Redis 配置（可选，推荐）
      # - REDIS_CONN_STRING=redis://redis:6379
      
      # 其他可选配置
      # - SESSION_SECRET=random_string
      # - POLLING_INTERVAL=60
      # - BATCH_UPDATE_ENABLED=true
      # - BATCH_UPDATE_INTERVAL=5
    depends_on:
      - redis
    networks:
      - one-api-network

  redis:
    image: redis:alpine
    container_name: one-api-redis
    restart: unless-stopped
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - one-api-network

  # 如果使用 MySQL，取消注释下面的服务
  # mysql:
  #   image: mysql:8.0
  #   container_name: one-api-mysql
  #   restart: unless-stopped
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=password
  #     - MYSQL_DATABASE=oneapi
  #   volumes:
  #     - ./mysql-data:/var/lib/mysql
  #   networks:
  #     - one-api-network

  # 如果使用 PostgreSQL，取消注释下面的服务
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: one-api-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=user
  #     - POSTGRES_PASSWORD=password
  #     - POSTGRES_DB=oneapi
  #   volumes:
  #     - ./postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - one-api-network

networks:
  one-api-network:
    driver: bridge
